<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CRUD WITH HANDSONTABLE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/styles/handsontable.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/styles/ht-theme-main.min.css" />
    <style>
        /* Asegura que <html> y <body> ocupen el 100% de la altura visible */
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            /* Color de fondo ligero */
        }

        .container_historico {
            position: absolute;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.767);
            height: 100%;
            width: 100%;
        }

        #historico_citas {
            width: 100%;
            height: 100%;
            max-height: 400px;
            max-width: 900px;
        }

        .x {
            margin: 40px;
        }

        .x svg {
            width: 40px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container_historico hidden">
        <div id="historico_citas"></div>
        <div class="x">
            <svg id="cerrar" onclick="esconder()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                overflow="visible">
                <path
                    d="M 6.4 15 L 10 11.4 L 13.6 15 L 15 13.6 L 11.4 10 L 15 6.4 L 13.6 5 L 10 8.6 L 6.4 5 L 5 6.4 L 8.6 10 L 5 13.6 Z M 10 20 C 8.617 20 7.317 19.738 6.1 19.213 C 4.883 18.688 3.825 17.975 2.925 17.075 C 2.025 16.175 1.312 15.117 0.787 13.9 C 0.263 12.683 0 11.383 0 10 C 0 8.617 0.262 7.317 0.787 6.1 C 1.313 4.883 2.025 3.825 2.925 2.925 C 3.825 2.025 4.883 1.312 6.1 0.787 C 7.317 0.263 8.617 0 10 0 C 11.383 0 12.683 0.262 13.9 0.787 C 15.117 1.313 16.175 2.025 17.075 2.925 C 17.975 3.825 18.688 4.883 19.213 6.1 C 19.737 7.317 20 8.617 20 10 C 20 11.383 19.738 12.683 19.213 13.9 C 18.688 15.117 17.975 16.175 17.075 17.075 C 16.175 17.975 15.117 18.688 13.9 19.213 C 12.683 19.737 11.383 20 10 20 Z M 10 18 C 12.233 18 14.125 17.225 15.675 15.675 C 17.225 14.125 18 12.233 18 10 C 18 7.767 17.225 5.875 15.675 4.325 C 14.125 2.775 12.233 2 10 2 C 7.767 2 5.875 2.775 4.325 4.325 C 2.775 5.875 2 7.767 2 10 C 2 12.233 2.775 14.125 4.325 15.675 C 5.875 17.225 7.767 18 10 18 Z M 10 10"
                    fill="rgb(227,227,227)"></path>
            </svg>
        </div>
    </div>
    <div class="container d-flex flex-column justify-content-center align-itmes-center h-100 ">
        <div class="title text-center pt-3">
            <h1>CRUD FOR CITAS WITH HANDSONTABLE</h1>
        </div>
        <div class="d-flex justify-content-center align-items-center py-3 bg-light">
            <input type="text" class="form-control w-50 shadow-sm rounded-pill" id="search_field"
            placeholder="Ingresa criterio de búsqueda">
        </div>
        <div class="label justify-content-center align-items-center" style="text-align: center;">
            <label>Ejecutivo en sesión: </label>
        </div>
        <div class="d-flex justify-content-center align-items-center py-3 bg-light">
            <select type="text" class="form-control w-50 shadow-sm rounded-pill" id="select_ejecutivo">
                <option value="">Cargando...</option>
            </select>
        </div>
    
        <div class="citas pt-3 d-flex justify-content-center align-itmes-center">
            <div id="citas" class="shadow-sm border bg-white" style="height: 500px; width: 70%; overflow-y: scroll;">
            </div>
        </div>
    </div>

</body>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
<script src="select_ejecutivo.js"></script>
<script async src="historico_citas.js"></script>
<script async src="handson.js"></script>

</html>
