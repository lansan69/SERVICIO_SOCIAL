<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CRUD: Arbol & Tabla</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/styles/handsontable.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/styles/ht-theme-main.min.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css" />

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* --- LAYOUT STYLES --- */
        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            /* Prevent body scroll, let containers scroll */
            background-color: #f8f9fa;
        }

        .full-height {
            height: 100vh;
        }

        .tree-container {
            background: white;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            padding: 20px;
            height: 100%;
        }

        .table-container {
            padding: 20px;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #citas {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* --- JSTREE GOOGLE ICON INTEGRATION --- */

        /* 1. Base Class for the Font */
        .material-icons-tree {
            font-family: 'Material Icons';
            font-weight: normal;
            font-style: normal;
            font-size: 18px;
            /* Fixed size matches jstree default */
            line-height: 24px;
            /* Center vertically */
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;

            /* Remove default jstree background image */
            background-image: none !important;
            background-position: center;

            /* Important for alignment */
            width: 24px;
            height: 24px;
            text-align: center;
            vertical-align: middle;
        }


        .material-icons-tree {
            /* ... other properties ... */
            background-image: none !important;
            background-color: transparent !important;
        }

        /* This forces jsTree to hide its own internal icon sprite */
        .jstree-default .jstree-themeicon-custom {
            background-image: none !important;
        }

        /* 2. Mapping Classes to Icon Content (Ligatures) */
        .icon-king::before {
            content: "workspace_premium";
        }

        .icon-lord::before {
            content: "holiday_village";
        }

        .icon-knight::before {
            content: "shield";
        }

        .icon-soldier::before {
            content: "colorize";
            transform: rotate(45deg);
            display: block;
        }

        .icon-peasant::before {
            content: "agriculture";
        }

        /* 3. Text Colors */
        .text-warning {
            color: #ffc107;
        }

        .text-secondary {
            color: #6c757d;
        }

        .text-primary {
            color: #0d6efd;
        }

        .text-danger {
            color: #dc3545;
        }

        .text-success {
            color: #198754;
        }
    </style>
</head>

<body>

    <div class="container-fluid full-height">
            <div class="col-md-3 tree-container shadow-sm align-items-sm-start">
                <h4 class="mb-3 text-muted">Organigrama</h4>

                <div id="arbol_ejecutivos">
                    <div class="text-center text-muted mt-5">Cargando árbol...</div>
                </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>
    <script src="arbol.js"></script>

</body>

</html>
