<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CRUD: Arbol & Tabla</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/styles/handsontable.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/styles/ht-theme-main.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        /* --- LAYOUT STYLES --- */
        html,
        body {
            height: 100%;
            margin: 0;
            background-color: #f4f7f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Create a flex wrapper for the sidebar and content */
        .main-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .tree-sidebar {
            width: 300px;
            min-width: 300px;
            background: white;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- HANDSONTABLE STYLING --- */
        .table-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e0e0e0;
        }

        /* Force Handsontable to fit its container */
        #citas {
            width: 100% !important;
            height: 450px !important;
            /* Fixed height for scrollability */
            overflow: hidden;
        }

        /* --- JSTREE ICON CUSTOMIZATION --- */
        .material-icons-tree {
            font-family: 'Material Icons' !important;
            font-size: 18px;
            width: 24px;
            height: 24px;
            display: inline-block;
            vertical-align: middle;
            background-image: none !important;
        }

        .icon-king::before {
            content: "workspace_premium";
            color: #ffc107;
        }

        .icon-lord::before {
            content: "holiday_village";
            color: #6c757d;
        }

        .icon-knight::before {
            content: "shield";
            color: #0d6efd;
        }

        .icon-soldier::before {
            content: "colorize";
            color: #dc3545;
        }

        .icon-peasant::before {
            content: "agriculture";
            color: #198754;
        }

        .jstree-default .jstree-themeicon-custom {
            background-image: none !important;
        }

        /* Search input styling */
        .search-pill {
            max-width: 500px;
            border-radius: 50px;
            padding: 10px 20px;
            border: 1px solid #ced4da;
            transition: all 0.3s;
        }

        .search-pill:focus {
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.2);
            border-color: #0d6efd;
        }
    </style>
</head>

<html>

    <div class="main-wrapper">
        <aside class="tree-sidebar shadow-sm">
            <h5 class="mb-3 fw-bold text-primary">
                <span class="material-icons align-middle">account_tree</span> Organigrama
            </h5>
            <hr>
            <div id="arbol_ejecutivos">
                <div class="text-center text-muted mt-5">Cargando árbol...</div>
            </div>
        </aside>

        <main class="content-area">
            <div class="header-section text-center">
                <h2 class="fw-bold text-dark">Gestión de Citas</h2>
                <p class="text-muted">Administración mediante Handsontable</p>
            </div>

            <div class="col-md-4">
                <label class="form-label small text-muted">Seleccionar Ejecutivo</label>
                <select class="form-select shadow-sm rounded-pill" id="select_ejecutivo">
                    <option value="">Cargando...</option>
                </select>
            </div>

            <div class="btn-group shadow-sm" role="group" aria-label="Filtro de alcance">
                <input type="radio" class="btn-check" name="scope_filter" id="scope_parent" value="padre">
                <label class="btn btn-outline-primary" for="scope_parent">Citas del Padre</label>

                <input type="radio" class="btn-check" name="scope_filter" id="scope_tree" value="arbol">
                <label class="btn btn-outline-primary" for="scope_tree">Citas del Árbol</label>
            </div>

            <div class="table-card">
                <div id="citas" class="ht-theme-main"></div>
            </div>
        </main>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>
    <script async src="historico_citas.js"></script>
    <script async src="handson.js"></script>
    <script src="arbol.js"></script>
</body>

</html>
