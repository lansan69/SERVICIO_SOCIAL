<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CRUD WITH HANDSONTABLE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/styles/handsontable.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/styles/ht-theme-main.min.css" />
    <style>
        /* Asegura que <html> y <body> ocupen el 100% de la altura visible */
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            /* Color de fondo ligero */
        }
    </style>
</head> 

<body>
    <div class="container d-flex flex-column justify-content-center align-itmes-center h-100 ">
        <div class="title text-center pt-3">
            <h1>CRUD FOR CITAS WITH HANDSONTABLE</h1>
        </div>
        <div class="d-flex justify-content-center align-items-center py-3 bg-light">
            <input type="text" class="form-control w-50 shadow-sm rounded-pill" id="search_field"
                placeholder="Ingresa criterio de búsqueda">
        </div>
        <div class="citas pt-3 d-flex justify-content-center align-itmes-center">
            <div id="citas" class="shadow-sm border bg-white"
                style="max-width: fit-content; height: 300px; width: 100%;"></div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <script src="handson.js"></script>
</body>

</html>
