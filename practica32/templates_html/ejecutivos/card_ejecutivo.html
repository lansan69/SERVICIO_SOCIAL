<div class="card shadow-sm border-0 rounded-4" style="width: 80%;">
    <div class="bg-primary rounded-top-4" style="height: 80px;"></div>
    
    <div class="text-center" style="margin-top: -50px;">
        <img id="card-image" src="ejecutivo/uploads/image.png" alt="Perfil" 
             class="rounded-circle border border-4 border-white shadow-sm" 
             style="width: 100px; height: 100px; object-fit: cover; background-color: #f8f9fa;">
    </div>

    <div class="card-body pt-2 px-4 pb-4">
        <h5 id="card-name" class="card-title text-center fw-bold mb-4">Name</h5>
        
        <ul class="list-group list-group-flush mb-4">
            <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                <span class="text-muted fw-semibold">Teléfono:</span>
                <span id="card-telefono" class="telefono text-dark text-end">123-456-7890</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                <span class="text-muted fw-semibold">Padre:</span>
                <span id="card-padre" class="padre text-dark text-end">Padre Name</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                <span class="text-muted fw-semibold">Tipo Ejecutivo:</span>
                <span id="card-tipo-ejecutivo" class="tipo-ejecutivo text-dark text-end">Tipo</span>
            </li>
        </ul>

        <h6 class="fw-bold text-secondary mb-3">Citas</h6>
        
       <div id="card-citas" class="citas border rounded-3 shadow-sm" style="height: 250px; width: 100%;">
</div>
    </div>
</div>
